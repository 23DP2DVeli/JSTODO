<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My To-Do List</h1>
        </header>
        
        <form class="todo-form">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button type="submit" id="addTaskBtn"><i class="fas fa-plus"></i> Add Task</button>
        </form>
        
        <div class="filters">
            <a href="#" class="filter active">All</a>
            <a href="#" class="filter">Active</a>
            <a href="#" class="filter">Completed</a>
            <audio id="myAudio" src="Pathetic_-_Dancing_Nihilist_slowed_reverb_(Hydr0.org).mp3"></audio>
        </div>
        
        <div class="todo-list" id="todoList">
            <!-- New tasks will be added here dynamically -->
        </div>

        <div class="music">
            <button id="playBtn">▶ Play music</button>
            <button id="stopBtn">■ Stop music</button>
            <button id="pauseBtn">⏸ Pause music</button>
        </div>


        <input type="text" id="soundcloudInput" placeholder="Вставь ссылку на трек SoundCloud">
        <button id="embedBtn">Добавить трек</button>
        <div id="playerContainer"></div>


        
    <script src="src/js/scripts.js" async defer></script>
</body>
</html>
